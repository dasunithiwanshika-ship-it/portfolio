<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="sa-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" rx="14" fill="url(#sa-bg)" />
  <rect width="800" height="450" rx="14" fill="url(#sa-grid)" />
  <rect x="0.5" y="0.5" width="799" height="449" rx="13.5" stroke="rgba(255, 255, 255, 0.08)" />

  <g transform="translate(40, 32)">
    <rect width="260" height="26" rx="13" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.3)" />
    <circle cx="13" cy="13" r="4" fill="#f59e0b" />
    <text x="25" y="17" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="0.5">STREAMLIT + PANDAS ETL PIPELINE</text>
  </g>

  <!-- 3-Column Pipeline Architecture -->
  <g transform="translate(50, 75)">
    <!-- Column 1: Multi-Source Ingestion -->
    <g transform="translate(0, 0)">
      <rect width="210" height="235" rx="8" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="16" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">STAGE 01: INGESTION</text>
      <text x="16" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">Multi-Feed Parsing</text>
      <text x="16" y="72" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Linkt Toll CSV/Excel feeds</text>
      <text x="16" y="92" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• 365/iStarr booking logs</text>
      <text x="16" y="112" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Python-Calamine reader</text>
      <text x="16" y="132" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Multi-format parsing</text>
      <text x="16" y="152" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Raw telemetry intake</text>
      <text x="16" y="185" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">file_readers.py</text>
    </g>

    <!-- Column 2: Transformation &amp; Matching Core -->
    <g transform="translate(235, 0)">
      <rect width="250" height="235" rx="8" fill="rgba(30, 41, 59, 0.95)" stroke="rgba(245, 158, 11, 0.45)" />
      <text x="16" y="26" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10">STAGE 02: AUTOMATION ENGINE</text>
      <text x="16" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">Toll Processing Core</text>
      <text x="16" y="72" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• RegEx plate normalization</text>
      <text x="16" y="92" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Time-window duplicate detector</text>
      <text x="16" y="112" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Booking interval matching</text>
      <text x="16" y="132" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Admin fee calculation logic</text>
      <text x="16" y="152" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Master store archive indexing</text>
      <text x="16" y="185" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10">toll_processor/processor.py</text>
    </g>

    <!-- Column 3: Output &amp; Streamlit UI -->
    <g transform="translate(510, 0)">
      <rect width="190" height="235" rx="8" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(16, 185, 129, 0.3)" />
      <text x="16" y="26" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">STAGE 03: INTERFACE</text>
      <text x="16" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">Streamlit Dashboard</text>
      <text x="16" y="72" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Daily Run execution mode</text>
      <text x="16" y="92" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Initial setup master loader</text>
      <text x="16" y="112" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Multi-sheet Excel exports</text>
      <text x="16" y="132" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Duplicates &amp; Unmatched</text>
      <text x="16" y="152" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Financial summary sheet</text>
      <text x="16" y="185" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">app.py / cli.py</text>
    </g>

    <!-- Connecting Arrows -->
    <path d="M 210 120 L 235 120" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M 485 120 L 510 120" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3" />
  </g>

  <!-- Bottom Terminal Execution Bar -->
  <g transform="translate(50, 335)">
    <rect width="700" height="85" rx="8" fill="rgba(2, 6, 23, 0.9)" stroke="rgba(255, 255, 255, 0.08)" />
    <circle cx="24" cy="22" r="4" fill="#ef4444" />
    <circle cx="38" cy="22" r="4" fill="#f59e0b" />
    <circle cx="52" cy="22" r="4" fill="#10b981" />
    <text x="74" y="26" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">streamlit run app.py [Python 3.x + Pandas + Calamine + Openpyxl]</text>
    <text x="24" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11.5">> Toll Processor initialized: Matching tolls to active 365/iStarr booking intervals</text>
    <text x="24" y="74" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11.5">> [SUCCESS] Master dataset compiled • 6-sheet Excel report generated</text>
  </g>
</svg>
