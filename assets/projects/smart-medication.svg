<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e18" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="sm-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <linearGradient id="emerald-glow-sm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#sm-bg)" />
  <rect width="800" height="450" rx="16" fill="url(#sm-grid)" />
  <rect x="0.5" y="0.5" width="799" height="449" rx="15.5" stroke="rgba(255, 255, 255, 0.12)" />

  <!-- Top Badge Header -->
  <g transform="translate(45, 30)">
    <rect width="280" height="30" rx="15" fill="rgba(16, 185, 129, 0.16)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1.5" />
    <circle cx="15" cy="15" r="4.5" fill="#10b981" />
    <text x="30" y="20" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.5">EMBEDDED HARDWARE &amp; GSM IOT</text>
  </g>

  <g transform="translate(560, 30)">
    <rect width="195" height="30" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="14" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">FIRMWARE: <tspan fill="#34d399" font-weight="700">Arduino C/C++</tspan></text>
  </g>

  <!-- Hardware Schematics Diagram -->

  <!-- Block 1: Local Peripherals (I2C LCD &amp; Buzzer) -->
  <g transform="translate(45, 75)">
    <rect width="220" height="225" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <rect x="0" y="0" width="220" height="4" rx="2" fill="#38bdf8" />
    
    <text x="18" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">01 / LOCAL INTERFACE</text>
    <text x="18" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15">I2C LCD &amp; Buzzer</text>
    
    <g transform="translate(18, 70)">
      <rect width="184" height="26" rx="5" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="10" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">16x2 LCD Schedule UI</text>
    </g>
    <g transform="translate(18, 104)">
      <rect width="184" height="26" rx="5" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="10" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Audible Multi-Tone Alert</text>
    </g>
    <g transform="translate(18, 138)">
      <rect width="184" height="26" rx="5" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="10" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Dosage Intake Feedback</text>
    </g>

    <text x="18" y="200" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Patient Reminder Unit</text>
  </g>

  <!-- Connector 1 -->
  <path d="M 265 185 L 290 185" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="290,181 296,185 290,189" fill="#10b981" />

  <!-- Block 2: Arduino MCU Core (Highlighted Center) -->
  <g transform="translate(290, 68)">
    <rect width="220" height="238" rx="12" fill="rgba(30, 41, 59, 0.95)" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1.5" />
    <rect x="0" y="0" width="220" height="5" rx="2" fill="url(#emerald-glow-sm)" />
    
    <text x="18" y="28" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">02 / EMBEDDED CONTROLLER</text>
    <text x="18" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15">Arduino MCU Core</text>
    
    <g transform="translate(18, 70)">
      <rect width="184" height="26" rx="5" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(16, 185, 129, 0.3)" />
      <text x="10" y="17" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11">RTC Precision Timekeeping</text>
    </g>
    <g transform="translate(18, 104)">
      <rect width="184" height="26" rx="5" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(16, 185, 129, 0.3)" />
      <text x="10" y="17" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11">Compartment Logic Engine</text>
    </g>
    <g transform="translate(18, 138)">
      <rect width="184" height="26" rx="5" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(16, 185, 129, 0.3)" />
      <text x="10" y="17" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11">Sensor Debounce &amp; Timers</text>
    </g>

    <text x="18" y="210" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">> Real-Time Regimen Control</text>
  </g>

  <!-- Connector 2 -->
  <path d="M 510 185 L 535 185" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="535,181 541,185 535,189" fill="#38bdf8" />

  <!-- Block 3: Cellular GSM Remote Dispatch -->
  <g transform="translate(535, 75)">
    <rect width="220" height="225" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <rect x="0" y="0" width="220" height="4" rx="2" fill="#38bdf8" />
    
    <text x="18" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">03 / REMOTE ESCALATION</text>
    <text x="18" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15">GSM Cellular Link</text>
    
    <g transform="translate(18, 70)">
      <rect width="184" height="26" rx="5" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="10" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">AT-Command Serial Link</text>
    </g>
    <g transform="translate(18, 104)">
      <rect width="184" height="26" rx="5" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="10" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Automated Caregiver SMS</text>
    </g>
    <g transform="translate(18, 138)">
      <rect width="184" height="26" rx="5" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="10" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Missed Dosage Trigger</text>
    </g>

    <text x="18" y="200" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Cellular Network Dispatch</text>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(45, 320)">
    <rect width="710" height="95" rx="10" fill="rgba(2, 6, 23, 0.95)" stroke="rgba(255, 255, 255, 0.15)" />
    
    <!-- Window controls -->
    <circle cx="24" cy="22" r="4.5" fill="#ef4444" />
    <circle cx="40" cy="22" r="4.5" fill="#f59e0b" />
    <circle cx="56" cy="22" r="4.5" fill="#10b981" />
    <text x="80" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">medication_controller.ino — Arduino C/C++ Firmware</text>
    
    <text x="24" y="56" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">void checkScheduledDose() { if(missedDose) sendSMSAlert(caregiverNumber); }</text>
    <text x="24" y="78" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">> [DEMO READY] Embedded hardware prototype &amp; GSM alerting verified</text>
  </g>
</svg>
