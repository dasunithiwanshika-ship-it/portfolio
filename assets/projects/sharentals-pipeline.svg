<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="sr-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" rx="14" fill="url(#sr-bg)" />
  <rect width="800" height="450" rx="14" fill="url(#sr-grid)" />
  <rect x="0.5" y="0.5" width="799" height="449" rx="13.5" stroke="rgba(255, 255, 255, 0.08)" />

  <g transform="translate(40, 32)">
    <rect width="270" height="26" rx="13" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.3)" />
    <circle cx="13" cy="13" r="4" fill="#f59e0b" />
    <text x="25" y="17" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="0.5">REACT/VITE WEB + DATA AUTOMATION</text>
  </g>

  <!-- Split Architecture Overview -->
  <g transform="translate(50, 80)">
    
    <!-- Left: React + Vite Web Client -->
    <g transform="translate(0, 0)">
      <rect width="210" height="225" rx="8" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(56, 189, 248, 0.3)" />
      <text x="16" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10.5">01 / WEB PLATFORM</text>
      <text x="16" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13.5">React + Vite Frontend</text>
      <text x="16" y="72" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Modern responsive UI</text>
      <text x="16" y="92" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Vehicle catalog portal</text>
      <text x="16" y="112" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Booking intake flows</text>
      <text x="16" y="132" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Client reservation state</text>
      <text x="16" y="160" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">GitHub Repository</text>
      <text x="16" y="180" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">sharentals-website</text>
    </g>

    <!-- Center: Python & Pandas Automation Engine -->
    <g transform="translate(235, 0)">
      <rect width="255" height="225" rx="8" fill="rgba(30, 41, 59, 0.95)" stroke="rgba(245, 158, 11, 0.45)" />
      <text x="16" y="26" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10.5">02 / DATA AUTOMATION ENGINE</text>
      <text x="16" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13.5">Python &amp; Pandas Pipeline</text>
      <text x="16" y="72" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Linkt toll transaction ETL</text>
      <text x="16" y="92" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• 365/iStarr booking ingestion</text>
      <text x="16" y="112" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• RegEx plate normalization</text>
      <text x="16" y="132" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Interval duplicate resolution</text>
      <text x="16" y="152" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Master record reconciliation</text>
      <text x="16" y="180" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10">Zero Manual Billing Leakage</text>
    </g>

    <!-- Right: Fleet Intelligence Deliverables -->
    <g transform="translate(515, 0)">
      <rect width="185" height="225" rx="8" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(16, 185, 129, 0.3)" />
      <text x="16" y="26" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10.5">03 / BUSINESS OUTPUT</text>
      <text x="16" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13.5">Fleet Intelligence</text>
      <text x="16" y="72" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Fleet availability analytics</text>
      <text x="16" y="92" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Idle vehicle reporting</text>
      <text x="16" y="112" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Reconciled ledger output</text>
      <text x="16" y="132" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Operational decision BI</text>
      <text x="16" y="160" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">Applied Commercial Value</text>
    </g>

    <!-- Connectors -->
    <path d="M 210 110 L 235 110" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M 490 110 L 515 110" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3" />
  </g>

  <!-- Bottom Terminal Execution Bar -->
  <g transform="translate(50, 330)">
    <rect width="700" height="85" rx="8" fill="rgba(2, 6, 23, 0.9)" stroke="rgba(255, 255, 255, 0.08)" />
    <circle cx="24" cy="22" r="4" fill="#ef4444" />
    <circle cx="38" cy="22" r="4" fill="#f59e0b" />
    <circle cx="52" cy="22" r="4" fill="#10b981" />
    <text x="74" y="26" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">sharentals_production_pipeline.py + vite_client</text>
    
    <text x="24" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">df_reconciled = reconcile_toll_booking(toll_stream, booking_stream)</text>
    <text x="24" y="74" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">> [OK] Web catalog live • 100% duplicate toll records resolved</text>
  </g>
</svg>
