<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="sr-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#sr-bg)" />
  <rect width="800" height="450" rx="16" fill="url(#sr-grid)" />
  <rect x="0.5" y="0.5" width="799" height="449" rx="15.5" stroke="rgba(255, 255, 255, 0.08)" />

  <g transform="translate(40, 36)">
    <rect width="210" height="28" rx="14" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.3)" />
    <circle cx="14" cy="14" r="4" fill="#f59e0b" />
    <text x="26" y="18" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.5">ENTERPRISE DATA PIPELINE</text>
  </g>

  <!-- Split Inputs -->
  <g transform="translate(60, 95)">
    <!-- Source 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="80" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="16" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">SOURCE A</text>
      <text x="16" y="52" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13">Linkt Toll Feeds</text>
      <text x="16" y="68" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Raw CSV / Transactions</text>
    </g>

    <!-- Source 2 -->
    <g transform="translate(0, 100)">
      <rect width="180" height="80" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="16" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">SOURCE B</text>
      <text x="16" y="52" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13">365/iStarr Bookings</text>
      <text x="16" y="68" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Operational logs</text>
    </g>

    <!-- Center Transformation Engine -->
    <g transform="translate(240, 0)">
      <rect width="210" height="180" rx="10" fill="rgba(30, 41, 59, 0.9)" stroke="rgba(245, 158, 11, 0.4)" />
      <text x="18" y="28" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">AUTOMATION ENGINE</text>
      <text x="18" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Pandas Data Pipeline</text>
      <text x="18" y="78" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• RegEx plate normalization</text>
      <text x="18" y="98" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Timestamp matching</text>
      <text x="18" y="118" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Duplicate trip resolution</text>
      <text x="18" y="138" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Master reconciliation</text>
      <text x="18" y="162" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">Zero manual re-entry</text>
    </g>

    <!-- Right Deliverables -->
    <g transform="translate(510, 0)">
      <rect width="170" height="180" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="16" y="28" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">OUTPUT ANALYTICS</text>
      <text x="16" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Fleet Insights</text>
      <text x="16" y="78" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Idle vehicle reports</text>
      <text x="16" y="100" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Fleet availability</text>
      <text x="16" y="122" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Structured master tables</text>
      <text x="16" y="152" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">Operational BI</text>
    </g>

    <!-- Connectors -->
    <path d="M 180 40 L 240 70" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M 180 140 L 240 110" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M 450 90 L 510 90" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3" />
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(60, 310)">
    <rect width="680" height="85" rx="8" fill="rgba(2, 6, 23, 0.9)" stroke="rgba(255, 255, 255, 0.08)" />
    <circle cx="24" cy="22" r="4" fill="#ef4444" />
    <circle cx="38" cy="22" r="4" fill="#f59e0b" />
    <circle cx="52" cy="22" r="4" fill="#10b981" />
    <text x="74" y="26" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">sharentals_etl.py</text>
    
    <text x="24" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">df_reconciled = merge_transactions(toll_df, booking_df, key='reg_clean')</text>
    <text x="24" y="74" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">> [SUCCESS] Master dataset compiled. 100% duplicate records resolved.</text>
  </g>
</svg>
