<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="grid-pattern-1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bg-grad-1)" />
  <rect width="800" height="450" rx="16" fill="url(#grid-pattern-1)" />
  <rect x="0.5" y="0.5" width="799" height="449" rx="15.5" stroke="rgba(255, 255, 255, 0.08)" />

  <!-- Title Pill -->
  <g transform="translate(40, 36)">
    <rect width="180" height="28" rx="14" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.3)" />
    <circle cx="14" cy="14" r="4" fill="#06b6d4" />
    <text x="26" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.5">CURRENT MAJOR AI APP</text>
  </g>

  <!-- Architecture Flow -->
  <!-- Node 1: Pantry Data -->
  <g transform="translate(60, 110)">
    <rect width="180" height="130" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" />
    <text x="20" y="32" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">01 / INPUT LAYER</text>
    <text x="20" y="58" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="15">Kitchen Inventory</text>
    <text x="20" y="80" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Pantry stock records</text>
    <text x="20" y="98" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Ingredient shelf-life</text>
    <text x="20" y="116" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="11">Expiry tracking</text>
  </g>

  <!-- Flow Connector 1 -->
  <path d="M 240 175 L 300 175" stroke="url(#cyan-glow)" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="270" cy="175" r="3" fill="#38bdf8" />

  <!-- Node 2: AI Optimization Core -->
  <g transform="translate(300, 90)">
    <rect width="200" height="170" rx="10" fill="rgba(30, 41, 59, 0.95)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="4" rx="2" fill="url(#cyan-glow)" />
    <text x="20" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">02 / AI ASSISTANT CORE</text>
    <text x="20" y="58" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16">Recipe Intelligence</text>
    <text x="20" y="82" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Dynamic match ranking</text>
    <text x="20" y="102" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Zero-waste suggestion</text>
    <text x="20" y="122" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Missing item detection</text>
    <text x="20" y="148" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">Prompt & Rule Engine</text>
  </g>

  <!-- Flow Connector 2 -->
  <path d="M 500 175 L 560 175" stroke="url(#emerald-glow)" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="530" cy="175" r="3" fill="#10b981" />

  <!-- Node 3: Output Assistant -->
  <g transform="translate(560, 110)">
    <rect width="180" height="130" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" />
    <text x="20" y="32" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">03 / OUTPUT & ACTION</text>
    <text x="20" y="58" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="15">Adaptive Recipes</text>
    <text x="20" y="80" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Step-by-step guidance</text>
    <text x="20" y="98" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Automated grocery list</text>
    <text x="20" y="116" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">Waste minimization</text>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(60, 310)">
    <rect width="680" height="85" rx="8" fill="rgba(2, 6, 23, 0.9)" stroke="rgba(255, 255, 255, 0.08)" />
    <!-- Terminal header dots -->
    <circle cx="24" cy="22" r="4" fill="#ef4444" />
    <circle cx="38" cy="22" r="4" fill="#f59e0b" />
    <circle cx="52" cy="22" r="4" fill="#10b981" />
    <text x="74" y="26" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">pipeline_execution.log</text>
    
    <text x="24" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">$ python -m kitchen_ai.engine --evaluate-pantry --threshold=0.85</text>
    <text x="24" y="74" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">> [OK] Stock indexed: 42 ingredients | Matching active | Recipe rank generated</text>
  </g>
</svg>
