<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e" />
      <stop offset="100%" stop-color="#111a28" />
    </linearGradient>
    <pattern id="sw-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" rx="14" fill="url(#sw-bg)" />
  <rect width="800" height="450" rx="14" fill="url(#sw-grid)" />
  <rect x="0.5" y="0.5" width="799" height="449" rx="13.5" stroke="rgba(255, 255, 255, 0.08)" />

  <!-- Badge -->
  <g transform="translate(40, 32)">
    <rect width="230" height="26" rx="13" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
    <circle cx="13" cy="13" r="4" fill="#38bdf8" />
    <text x="25" y="17" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="0.5">REACT 19 + VITE + TAILWIND V4</text>
  </g>

  <!-- Browser Container -->
  <g transform="translate(50, 75)">
    <rect width="700" height="245" rx="10" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(255, 255, 255, 0.12)" />
    
    <!-- Top Bar -->
    <rect width="700" height="34" rx="10" fill="rgba(8, 12, 20, 0.9)" />
    <circle cx="18" cy="17" r="4" fill="#ef4444" />
    <circle cx="32" cy="17" r="4" fill="#f59e0b" />
    <circle cx="46" cy="17" r="4" fill="#10b981" />
    <rect x="68" y="7" width="360" height="20" rx="4" fill="rgba(255, 255, 255, 0.06)" />
    <text x="80" y="21" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">https://sharentals.com.au</text>

    <!-- App Component Architecture Grid -->
    <!-- Nav Component -->
    <rect x="18" y="48" width="664" height="26" rx="4" fill="rgba(255, 255, 255, 0.03)" />
    <text x="32" y="65" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">SHARENTALS</text>
    <text x="440" y="65" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5">Services • Promotions • Inquiry • Contact</text>

    <!-- Main Content Area -->
    <g transform="translate(18, 84)">
      <!-- Left: Hero Component -->
      <rect width="360" height="145" rx="6" fill="rgba(56, 189, 248, 0.06)" stroke="rgba(56, 189, 248, 0.2)" />
      <text x="18" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">&lt;Hero /&gt; + &lt;Promotions /&gt;</text>
      <text x="18" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">Seamless Car Rental &amp; Rideshare Fleet</text>
      <text x="18" y="74" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5">Fleet catalog, competitive pricing &amp; instant booking reservation</text>
      <rect x="18" y="94" width="110" height="28" rx="14" fill="#38bdf8" />
      <text x="38" y="112" fill="#030712" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10.5">Explore Fleet</text>
    </g>

    <g transform="translate(390, 84)">
      <!-- Right Top: Inquiry Component -->
      <rect width="292" height="68" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="14" y="22" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">&lt;Inquiry /&gt;</text>
      <text x="14" y="42" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">Vehicle Reservation Intake</text>
      <text x="14" y="58" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5">Form validation &amp; booking state</text>

      <!-- Right Bottom: HowItWorks Component -->
      <rect y="77" width="292" height="68" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="14" y="97" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9.5">&lt;HowItWorks /&gt;</text>
      <text x="14" y="117" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">Step-by-Step Rental Flow</text>
      <text x="14" y="133" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5">Transparent rideshare &amp; rental guide</text>
    </g>
  </g>

  <!-- Bottom Terminal Execution Bar -->
  <g transform="translate(50, 335)">
    <rect width="700" height="85" rx="8" fill="rgba(2, 6, 23, 0.9)" stroke="rgba(255, 255, 255, 0.08)" />
    <circle cx="24" cy="22" r="4" fill="#ef4444" />
    <circle cx="38" cy="22" r="4" fill="#f59e0b" />
    <circle cx="52" cy="22" r="4" fill="#10b981" />
    <text x="74" y="26" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">sharentals-website/src/App.jsx [React 19.2 + Vite 8.3 + Tailwind 4.3]</text>
    <text x="24" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11.5">VITE v8.3.0 ready in 180 ms | Local: http://localhost:5173/</text>
    <text x="24" y="74" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11.5">> [BUILD SUCCESS] 9 modular components compiled • zero latency client UI</text>
  </g>
