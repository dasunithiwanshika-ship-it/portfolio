<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="telecom-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="telecom-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
    <linearGradient id="amber-alert" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#telecom-bg)" />
  <rect width="800" height="450" rx="16" fill="url(#telecom-grid)" />
  <rect x="0.5" y="0.5" width="799" height="449" rx="15.5" stroke="rgba(255, 255, 255, 0.08)" />

  <!-- Badge -->
  <g transform="translate(40, 36)">
    <rect width="165" height="28" rx="14" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.3)" />
    <circle cx="14" cy="14" r="4" fill="#f59e0b" />
    <text x="26" y="18" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.5">PUBLIC KPI DATASET</text>
  </g>

  <!-- Left Chart / Metric Simulation -->
  <g transform="translate(60, 90)">
    <rect width="320" height="190" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="20" y="32" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">KPI TIME-SERIES TELEMETRY</text>
    <text x="20" y="56" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Traffic Load & Dropped Call Rate</text>
    
    <!-- Time series chart wave -->
    <path d="M 20 130 Q 60 110 100 135 T 160 140 T 200 80 T 240 145 T 280 130" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Anomaly spike region -->
    <circle cx="200" cy="80" r="7" fill="rgba(239, 68, 68, 0.3)" stroke="#ef4444" stroke-width="2" />
    <text x="180" y="65" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FAULT RISK</text>
    
    <!-- Secondary baseline -->
    <path d="M 20 150 Q 70 145 130 155 T 210 150 T 280 148" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="20" y="175" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Window: Rolling 24H | Noise-filtered</text>
  </g>

  <!-- Right ML Pipeline -->
  <g transform="translate(410, 90)">
    <rect width="330" height="190" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="20" y="32" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">ML DETECTION PIPELINE</text>
    
    <!-- Step 1 -->
    <g transform="translate(20, 50)">
      <rect width="290" height="34" rx="6" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="12" y="22" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">01. Preprocessing & Z-Score Scaling</text>
    </g>
    <!-- Step 2 -->
    <g transform="translate(20, 92)">
      <rect width="290" height="34" rx="6" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="12" y="22" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">02. Feature Eng: Temporal & Congestion</text>
    </g>
    <!-- Step 3 -->
    <g transform="translate(20, 134)">
      <rect width="290" height="34" rx="6" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" />
      <text x="12" y="22" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">03. Unsupervised / Supervised Anomaly</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(60, 310)">
    <rect width="680" height="85" rx="8" fill="rgba(2, 6, 23, 0.9)" stroke="rgba(255, 255, 255, 0.08)" />
    <circle cx="24" cy="22" r="4" fill="#ef4444" />
    <circle cx="38" cy="22" r="4" fill="#f59e0b" />
    <circle cx="52" cy="22" r="4" fill="#10b981" />
    <text x="74" y="26" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">telecom_pipeline.ipynb</text>
    
    <text x="24" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">from sklearn.ensemble import IsolationForest | KPI Feature Matrix [N x 18]</text>
    <text x="24" y="74" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12">> Status: Pipeline actively calibrating on public KPI benchmarks</text>
  </g>
</svg>
