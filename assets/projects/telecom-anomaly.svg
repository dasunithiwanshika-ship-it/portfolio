<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="telecom-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="telecom-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <linearGradient id="amber-alert" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#telecom-bg)" />
  <rect width="800" height="450" rx="16" fill="url(#telecom-grid)" />
  <rect x="0.5" y="0.5" width="799" height="449" rx="15.5" stroke="rgba(255, 255, 255, 0.12)" />

  <!-- Top Badge Header -->
  <g transform="translate(45, 30)">
    <rect width="260" height="30" rx="15" fill="rgba(245, 158, 11, 0.16)" stroke="rgba(245, 158, 11, 0.45)" stroke-width="1.5" />
    <circle cx="15" cy="15" r="4.5" fill="#f59e0b" />
    <text x="30" y="20" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.5">TIME-SERIES ANOMALY DETECTION</text>
  </g>

  <g transform="translate(540, 30)">
    <rect width="215" height="30" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="14" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">BENCHMARK: <tspan fill="#fbbf24" font-weight="700">Telecom KPI Data</tspan></text>
  </g>

  <!-- Left: KPI Telemetry Chart Simulation -->
  <g transform="translate(45, 75)">
    <rect width="335" height="230" rx="12" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <rect x="0" y="0" width="335" height="4" rx="2" fill="#38bdf8" />
    
    <text x="20" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">01 / TELEMETRY TIME-SERIES</text>
    <text x="20" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15">Traffic Load &amp; Call Drop Rate</text>
    
    <!-- Chart Background Grid -->
    <rect x="20" y="70" width="295" height="115" rx="6" fill="rgba(2, 6, 23, 0.7)" stroke="rgba(255, 255, 255, 0.06)" />
    <line x1="20" y1="105" x2="315" y2="105" stroke="rgba(255, 255, 255, 0.05)" stroke-dasharray="3 3" />
    <line x1="20" y1="145" x2="315" y2="145" stroke="rgba(255, 255, 255, 0.05)" stroke-dasharray="3 3" />
    
    <!-- Time series chart wave -->
    <path d="M 30 150 Q 70 120 110 145 T 170 150 T 210 85 T 250 155 T 305 140" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- Anomaly spike region -->
    <circle cx="210" cy="85" r="8" fill="rgba(239, 68, 68, 0.35)" stroke="#ef4444" stroke-width="2.5" />
    <rect x="180" y="60" width="62" height="18" rx="4" fill="#ef4444" />
    <text x="185" y="73" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800">FAULT SPIKE</text>
    
    <!-- Secondary baseline -->
    <path d="M 30 165 Q 80 160 140 168 T 220 165 T 305 162" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" />
    
    <text x="20" y="208" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Window: <tspan fill="#f1f5f9">Rolling 24H</tspan> | Z-Score &gt; 3.0</text>
  </g>

  <!-- Right: ML Anomaly Pipeline -->
  <g transform="translate(400, 75)">
    <rect width="355" height="230" rx="12" fill="rgba(30, 41, 59, 0.95)" stroke="rgba(245, 158, 11, 0.45)" stroke-width="1.5" />
    <rect x="0" y="0" width="355" height="4" rx="2" fill="url(#amber-alert)" />
    
    <text x="20" y="28" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">02 / FAULT-RISK ML PIPELINE</text>
    <text x="20" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15">Isolation Forest &amp; Clustered Scoring</text>
    
    <!-- Step 1 -->
    <g transform="translate(20, 68)">
      <rect width="315" height="34" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="14" y="22" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">01. Temporal &amp; Congestion Feature Scaling</text>
    </g>
    <!-- Step 2 -->
    <g transform="translate(20, 110)">
      <rect width="315" height="34" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="14" y="22" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">02. Unsupervised Outlier Isolation Trees</text>
    </g>
    <!-- Step 3 -->
    <g transform="translate(20, 152)">
      <rect width="315" height="34" rx="6" fill="rgba(245, 158, 11, 0.2)" stroke="rgba(245, 158, 11, 0.5)" />
      <text x="14" y="22" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">03. Automated Fault-Risk Prioritization</text>
    </g>

    <text x="20" y="210" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">> Anomaly Score Calibration Active</text>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(45, 320)">
    <rect width="710" height="95" rx="10" fill="rgba(2, 6, 23, 0.95)" stroke="rgba(255, 255, 255, 0.15)" />
    
    <circle cx="24" cy="22" r="4.5" fill="#ef4444" />
    <circle cx="40" cy="22" r="4.5" fill="#f59e0b" />
    <circle cx="56" cy="22" r="4.5" fill="#10b981" />
    <text x="80" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">telecom_pipeline.ipynb — Python &amp; Scikit-Learn</text>
    
    <text x="24" y="56" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">model = IsolationForest(contamination=0.03, random_state=42).fit(kpi_matrix)</text>
    <text x="24" y="78" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">> [ANALYSIS] Telemetry Anomaly Index &amp; Risk Thresholds Generated</text>
  </g>
</svg>
