<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <pattern id="fn-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#fn-bg)" />
  <rect width="800" height="450" rx="16" fill="url(#fn-grid)" />
  <rect x="0.5" y="0.5" width="799" height="449" rx="15.5" stroke="rgba(255, 255, 255, 0.08)" />

  <g transform="translate(40, 36)">
    <rect width="180" height="28" rx="14" fill="rgba(129, 140, 248, 0.12)" stroke="rgba(129, 140, 248, 0.3)" />
    <circle cx="14" cy="14" r="4" fill="#818cf8" />
    <text x="26" y="18" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.5">72K+ WELFAKE DATASET</text>
  </g>

  <!-- Flow pipeline representation -->
  <g transform="translate(60, 95)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="190" height="180" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="18" y="30" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11">STAGE 01</text>
    <text x="18" y="55" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">NLP Preprocessing</text>
    <text x="18" y="80" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Regex cleansing</text>
    <text x="18" y="100" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Stopword filtering</text>
    <text x="18" y="120" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Lemmatization / tokens</text>
    <text x="18" y="150" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">72,134 Articles</text>

    <!-- Stage 2 -->
    <rect x="245" y="0" width="190" height="180" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="18" y="30" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11">STAGE 02</text>
    <text x="18" y="55" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Feature Vectorization</text>
    <text x="18" y="80" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• TF-IDF N-grams</text>
    <text x="18" y="100" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Word2Vec embeddings</text>
    <text x="18" y="120" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Dense representations</text>
    <text x="18" y="150" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">N-dim Vector Space</text>

    <!-- Stage 3 -->
    <rect x="490" y="0" width="190" height="180" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(129, 140, 248, 0.4)" />
    <text x="18" y="30" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11">STAGE 03</text>
    <text x="18" y="55" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Classification Models</text>
    <text x="18" y="80" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• PyTorch / TensorFlow</text>
    <text x="18" y="100" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Scikit-learn Baselines</text>
    <text x="18" y="120" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Confusion Matrix Eval</text>
    <text x="18" y="150" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">Binary Real/Fake Output</text>

    <!-- Connection arrows -->
    <path d="M 195 90 L 240 90" stroke="#818cf8" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M 440 90 L 485 90" stroke="#818cf8" stroke-width="2" stroke-dasharray="3 3" />
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(60, 310)">
    <rect width="680" height="85" rx="8" fill="rgba(2, 6, 23, 0.9)" stroke="rgba(255, 255, 255, 0.08)" />
    <circle cx="24" cy="22" r="4" fill="#ef4444" />
    <circle cx="38" cy="22" r="4" fill="#f59e0b" />
    <circle cx="52" cy="22" r="4" fill="#10b981" />
    <text x="74" y="26" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">model_training.py</text>
    
    <text x="24" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">vectorizer = TfidfVectorizer(max_features=10000, ngram_range=(1,2))</text>
    <text x="24" y="74" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">> [EVAL] Precision, Recall & F1-score validated on test splits</text>
  </g>
</svg>
