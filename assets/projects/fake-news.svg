<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="indigo-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="fn-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#fn-bg)" />
  <rect width="800" height="450" rx="16" fill="url(#fn-grid)" />
  <rect x="0.5" y="0.5" width="799" height="449" rx="15.5" stroke="rgba(255, 255, 255, 0.12)" />

  <!-- Top Badge Header -->
  <g transform="translate(45, 30)">
    <rect width="280" height="30" rx="15" fill="rgba(99, 102, 241, 0.16)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" />
    <circle cx="15" cy="15" r="4.5" fill="#818cf8" />
    <text x="30" y="20" fill="#c7d2fe" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.5">NLP &amp; DEEP LEARNING PIPELINE</text>
  </g>

  <g transform="translate(560, 30)">
    <rect width="195" height="30" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="14" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">DATASET: <tspan fill="#38bdf8" font-weight="700">72K+ WELFake</tspan></text>
  </g>

  <!-- Pipeline 3-Column Architecture Cards -->
  
  <!-- Column 1: Preprocessing &amp; Text Cleaning -->
  <g transform="translate(45, 80)">
    <rect width="220" height="215" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <rect x="0" y="0" width="220" height="4" rx="2" fill="#818cf8" />
    
    <text x="18" y="28" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">01 / PREPROCESSING</text>
    <text x="18" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15">Text Cleaning</text>
    
    <g transform="translate(18, 70)">
      <rect width="184" height="26" rx="5" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="10" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Regex &amp; HTML Strip</text>
    </g>
    <g transform="translate(18, 104)">
      <rect width="184" height="26" rx="5" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="10" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Stopwords &amp; Punctuation</text>
    </g>
    <g transform="translate(18, 138)">
      <rect width="184" height="26" rx="5" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="10" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">NLTK Lemmatization</text>
    </g>

    <text x="18" y="195" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">72,134 Raw Articles</text>
  </g>

  <!-- Connector 1 -->
  <path d="M 265 185 L 290 185" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="290,181 296,185 290,189" fill="#818cf8" />

  <!-- Column 2: Vectorization &amp; Embeddings (Highlighted Center) -->
  <g transform="translate(290, 72)">
    <rect width="220" height="230" rx="12" fill="rgba(30, 41, 59, 0.95)" stroke="rgba(129, 140, 248, 0.5)" stroke-width="1.5" />
    <rect x="0" y="0" width="220" height="5" rx="2" fill="url(#indigo-purple)" />
    
    <text x="18" y="28" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">02 / VECTOR SPACE</text>
    <text x="18" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15">Embeddings &amp; TF-IDF</text>
    
    <g transform="translate(18, 70)">
      <rect width="184" height="26" rx="5" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(129, 140, 248, 0.3)" />
      <text x="10" y="17" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11">TF-IDF (10,000 Vocab)</text>
    </g>
    <g transform="translate(18, 104)">
      <rect width="184" height="26" rx="5" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(129, 140, 248, 0.3)" />
      <text x="10" y="17" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11">Word2Vec Embeddings</text>
    </g>
    <g transform="translate(18, 138)">
      <rect width="184" height="26" rx="5" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(129, 140, 248, 0.3)" />
      <text x="10" y="17" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="11">Dense Feature Matrix</text>
    </g>

    <text x="18" y="205" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">N-Dimensional Vectors</text>
  </g>

  <!-- Connector 2 -->
  <path d="M 510 185 L 535 185" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="535,181 541,185 535,189" fill="#a855f7" />

  <!-- Column 3: Classification &amp; Evaluation -->
  <g transform="translate(535, 80)">
    <rect width="220" height="215" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <rect x="0" y="0" width="220" height="4" rx="2" fill="#10b981" />
    
    <text x="18" y="28" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">03 / CLASSIFICATION</text>
    <text x="18" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15">Models &amp; Validation</text>
    
    <g transform="translate(18, 70)">
      <rect width="184" height="26" rx="5" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="10" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">PyTorch / TensorFlow</text>
    </g>
    <g transform="translate(18, 104)">
      <rect width="184" height="26" rx="5" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="10" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Scikit-Learn Baselines</text>
    </g>
    <g transform="translate(18, 138)">
      <rect width="184" height="26" rx="5" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="10" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Confusion Matrix Eval</text>
    </g>

    <text x="18" y="195" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">> Real vs Fake Prediction</text>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(45, 320)">
    <rect width="710" height="95" rx="10" fill="rgba(2, 6, 23, 0.95)" stroke="rgba(255, 255, 255, 0.15)" />
    
    <!-- Window controls -->
    <circle cx="24" cy="22" r="4.5" fill="#ef4444" />
    <circle cx="40" cy="22" r="4.5" fill="#f59e0b" />
    <circle cx="56" cy="22" r="4.5" fill="#10b981" />
    <text x="80" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">evaluate_nlp_pipeline.py — PyTorch &amp; Scikit-Learn</text>
    
    <text x="24" y="56" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="12">vectorizer = TfidfVectorizer(max_features=10000, ngram_range=(1,2), sublinear_tf=True)</text>
    <text x="24" y="78" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">> [SUCCESS] Test Split Validated: Precision, Recall &amp; F1-Score Calculated</text>
  </g>
</svg>
